# FluxoGestão — Nginx reverse proxy
# HTTP :80 → 127.0.0.1:3100
# TLS: depois de apontar um domínio, rode certbot --nginx -d SEU_DOMINIO

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

upstream fluxogestao {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 178.253.250.173 _;

    server_tokens off;
    client_max_body_size 8m;
    gzip off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com; font-src 'self' data:; connect-src 'self' ws: wss: https://*.supabase.co wss://*.supabase.co https://api.mercadopago.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(?:env|git|gitignore|sql|log|bak)$ {
        deny all;
        return 404;
    }
    location ~* ^/(?:package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|\.env\.local)$ {
        deny all;
        return 404;
    }

    location /_next/webpack-hmr {
        proxy_pass http://fluxogestao;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    location /_next/ {
        proxy_pass http://fluxogestao;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /api/auth/login {
        limit_req zone=login burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://fluxogestao;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://fluxogestao;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
